name: 打包 Windows EXE

on:
  push:
    branches: [ "main", "master" ]  # 不管你的主分支叫 main 還叫 master 都會觸發
  workflow_dispatch:                 # 允許你在網頁上點擊按鈕手動觸發

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 複製程式碼到環境
      uses: actions/checkout@v4

    - name: 安裝 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝打包工具與依賴套件
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # 根據你的腳本，安裝所需的依賴套件 (加入 openpyxl 確保 excel 能正常匯出)
        pip install selenium pandas openpyxl

    - name: 執行 PyInstaller 打包
      run: |
        # 使用 --onefile 打包成單一執行檔
        pyinstaller --onefile ClimbFbSocieties.py

    - name: 上傳打包好的 EXE 檔案
      uses: actions/upload-artifact@v4
      with:
        name: ClimbFbSocieties
        path: dist/ClimbFbSocieties.exe
